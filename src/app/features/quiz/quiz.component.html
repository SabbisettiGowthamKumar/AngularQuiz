<section class="quiz-page">
  <header class="quiz-page__header">
    <app-quiz-header></app-quiz-header>
    <app-progress-bar
      [answered]="quiz.answeredCount()"
      [total]="quiz.totalQuestions()"
    ></app-progress-bar>
  </header>

  <main class="quiz-page__layout" [style.grid-template-columns]="sidebarWidth() + ' 1fr 500px'">
    <aside class="quiz-page__sidebar">
      <app-side-panel
        [collapsed]="isSidebarCollapsed()"
        (collapsedChange)="togglesidebar()"
      ></app-side-panel>
    </aside>

    <section class="quiz-page__questions">
      <app-question-panel
        [currentIndex]="quiz.currentIndex()"
        [totalQuestions]="quiz.totalQuestions()"
        [questionText]="quiz.currentQuestion().content || ''"
        [markedForReview]="quiz.isMarked()"
        (markForReview)="quiz.toggleReview()"
      ></app-question-panel>
    </section>

    <section class="quiz-page__options">
      <app-options-panel
        [options]="quiz.currentQuestion().options"
        [selectedAnswer]="quiz.selectedAnswer()"
        [isFirstQuestion]="quiz.isFirstQuestion()"
        [isLastQuestion]="quiz.isLastQuestion()"
        (answerChange)="quiz.selectAnswer($event)"
        (clear)="quiz.clearAnswer()"
        (previous)="quiz.previousQuestion()"
        (next)="quiz.nextQuestion()"
      ></app-options-panel>
    </section>
  </main>

  <footer class="quiz-page__footer"><app-footer></app-footer></footer>
</section>
