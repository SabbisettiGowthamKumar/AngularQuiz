<section class="quiz-page">
  <header class="quiz-page__header">
    <app-quiz-header></app-quiz-header>
    <app-progress-bar [answered]="5" [total]="50"></app-progress-bar>
  </header>

  <main class="quiz-page__layout">
    <aside class="quiz-page__sidebar">sidebar Placeholder</aside>

    <section class="quiz-page__questions">
      <app-question-panel
        [currentIndex]="0"
        [totalQuestions]="10"
        [questionText]="questionText"
        [markedForReview]="false"
        (markReview)="onMarkReview($event)"
      ></app-question-panel>
    </section>

    <section class="quiz-page__options">Options Placeholder</section>
  </main>

  <footer class="quiz-page__footer">Footer Placeholder</footer>
</section>
