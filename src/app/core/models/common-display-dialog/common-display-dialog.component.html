<section class="dialog-area app-background-style">
  <h2 class="mat-dialog-title title-style">{{ data.title }}</h2>

  <mat-dialog-content class="text-style">
    {{ data.message }}
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    @if (!data.hideCancel) {
      <button class="mat-button mat-dialog-close">
        {{ data.cancelText || 'Cancel' }}
      </button>
    }
    <button mat-raised-button color="primary" [mat-dialog-close]="true">
      {{ data.confirmText || 'OK' }}
    </button>
  </mat-dialog-actions>
</section>
