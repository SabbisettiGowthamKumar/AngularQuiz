<section class="progress-bar">
  <div class="progress-bar__top text-style">
    <div>
      <span class="small-title-style no-xs">Progress:</span>{{ answered }} / {{ total }}
      <span class="no-xs">Answered</span>
    </div>
    <p class="progress-bar__meta">{{ percentage }}% <span class="no-xs">Completed</span></p>
  </div>

  <mat-progress-bar mode="determinate" [value]="percentage"></mat-progress-bar>
</section>
